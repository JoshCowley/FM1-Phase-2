# FM1 Phase 2 firmware (forked from MODFM1's FM1 Rack at update 59, 14 Nov 2026), an fm1-base app (fm1-base's tools/build.py reads this). See README.md.
name = "FM1PH2"
id_prefix = "FM-1_79"          # package identity: dev builds FM-1_7900 (FM1 Phase 2, forked from MODFM1's FM-1_78; not registered anywhere)
usb_manufacturer = "FM1PH2"
usb_product = "FM1 PHASE 2"
words = "words.tsv"
ble = false
# the second core (fm1-base's plat_cpu2_*) renders half the voices (rack.cc render_voices), with the fallback, a unit
# whose second core misbehaves (fm1-base's notes: some FM-1s misread shared RAM) carries on with one core
# USB audio (update 57, Josh: "I would like audio over USB"; off from 8 Nov to update 56): the FM-1 shows up as an
# audio device beside its MIDI, recordable on the computer (in), and the computer can play through it (out). Costs
# about 1.7 KB of flash and 11 KB of RAM (90.9 of 98.3 KB used). usb_midi_last stays at fm1-base's default (true), the
# order macOS 13-15 need to show the audio device
usb_audio_in = true
usb_audio_out = true
cpu2 = true
cpu2_fallback = true
# RACK_ARENA_KB 256 (2.43: was 304: the voice's comb memory halved, 8 KB less a voice; update 58: was 308): 4 KB of the pool for the USB recording's deeper ring (app.h FM1B_UAC_DEEP);
# the heaviest factory preset uses 300 KB (rack_host's arena column)
# the engine and the Mutable modules as C++ units, at -O2 (for speed: -Os was 36 KB smaller but about 15 % slower, measured 4 Nov 2026; back to -O2 on 8 Nov) with -fdata-sections (unused tables dropped: 46 KB, same code); the rest (unity_opt below) at -Oz, with the FM-1's float flags (build.py adds -mcpu=r3
# -mfprev1 -ffp-contract=off): units/ is written by make_units.py before each build (gen below)
gen = ["make_units.py", "make_font.py {gen}"]   # (update 51: make_font.py, FM1 Rack's own typeface, over fm1-base's)
o2 = ["units/*.cc"]
o2_cflags = ["-std=gnu++11", "-w", "-fbuiltin", "-fno-exceptions", "-fno-rtti", "-DTEST", "-DRACK_FM1", "-DRACK_LITE",
             "-DRACK_ARENA_KB=304", "-DRACK_ARENA_POOL", "-DRACK_RINGS16", "-DRACK_NO_PLAITS", "-DRACK_DRUMS", "-DRACK_BRAIDS_TRIM", "-DRACK_WAVE", "-DRACK_OUTN=288", "-O2", "-fdata-sections"]
# WAVE (Plaits' wavetable engine, MIT; 2.48) is a source: -DRACK_WAVE (engine/rack.cc, units/rack_wave_osc.h and the 50,688 B wave data from common/make_wave_osc.py).
# Clouds (the granular processor) was removed in 2.48; the second core renders half the voices only.
# GRAIN (the home-made granular source) is SHELVED: compiled only with -DRACK_WITH_GRAIN, which is not in o2_cflags above. To build it in, add
# "-DRACK_WITH_GRAIN" to o2_cflags (and to the bench's fm1.toml); on a computer: RACK_FLAGS=-DRACK_WITH_GRAIN sh build_host.sh
# FM1 Rack's Plaits shim (first: it stands in for one of Plaits' headers), the Mutable code (a checkout of
# pichenettes/eurorack beside MODFM1)
include = ["../../../engine/shim", "units", "../../../../eurorack"]   # (2.42: units/ ahead of the checkout: its changed headers, units/braids/ and so on, win; make_mutable_slim.py)
# the few C++ standard headers JieLi's toolchain lacks, and C headers for a build with no C library (firmware only)
device_include = ["../../hw/cxx", "../../hw/libc"]
vendored = ["units/"]
licence = "GPL-3.0"               # the firmware as a whole (FM1 Rack's engine); app.c and app.h are MPL-2.0, from fm1-base's template
tagline = "a modular synth voice from Mutable Instruments modules"
credits = "Mutable Instruments' open-source module code (github.com/pichenettes/eurorack)"
author = "Josh Cowley"
repo = "https://github.com/JoshCowley/FM1-Phase-2"
site = "https://joshcowley.github.io/FM1-Phase-2/"
install = "https://joshcowley.github.io/FM1-Phase-2/install/"
description = "FM1 Phase 2 turns the M-VAVE FM-1 into a polyphonic synth voice built from Mutable Instruments' open-source module code: Braids oscillators, Rings, a filter, Tides, Peaks, Grids and function generators, a modulation matrix, delay, reverb, chorus and Plaits' wavetable source. Four macro knobs per preset; HOME shows the sound as a live spectral ribbon. A pre-release: not yet tested widely on hardware."
tags = ["synth", "ambient", "experimental"]
screenshot = "docs/img/screen.png"
boot_pack = true
unity_opt = "z"
